name: Bug report
description: Report a reproducible problem in PlanDeck.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove API keys, tokens, usernames, private paths, and session data before submitting.
  - type: input
    id: version
    attributes:
      label: PlanDeck version
      placeholder: 0.1.0 Beta
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS and architecture
      placeholder: macOS 15.x, Apple Silicon
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
    validations:
      required: true
