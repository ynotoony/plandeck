name: Bug report
description: Report a reproducible problem in PlanDeck.
title: "bug: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Remove API keys, tokens, usernames, private paths, and session data before submitting.
  - type: input
    id: version
    attributes:
      label: PlanDeck version
      placeholder: 0.1.0 Beta
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS and architecture
      placeholder: macOS 15.x, Apple Silicon
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
    validations:
      required: true
  - type: checkboxes
    id: areas
    attributes:
      label: Affected areas
      options:
        - label: Core / adapters / Catalog
        - label: Desktop UI / interaction
        - label: Native runtime / filesystem / tray
        - label: CI / packaging / release
        - label: Documentation
        - label: Not sure
  - type: dropdown
    id: scope_shape
    attributes:
      label: Scope shape
      options:
        - One independently useful outcome
        - Multiple independently useful outcomes
        - Unknown
    validations:
      required: true
  - type: dropdown
    id: unknowns
    attributes:
      label: Unknowns
      options:
        - Clear enough to implement
        - Some technical or product unknowns
        - Research or prototype needed first
    validations:
      required: true
  - type: checkboxes
    id: risks
    attributes:
      label: Risk flags
      options:
        - label: Persistent data, migration, or compatibility
        - label: Credentials, permissions, security, or privacy
        - label: External service, API, or operating-system behavior
        - label: Packaging, versioning, rollout, or release notes
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the observable conditions that prove the bug is fixed.
      placeholder: "- The background is consistent in light mode\n- Dark mode is unchanged"
    validations:
      required: true
