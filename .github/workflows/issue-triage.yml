# input: issues opened/edited/reopened 事件
# output: issue 上的 size 分级评论与标签
# position: 需求自动分级流水线
# 维护：一旦我被更新，务必更新我的开头注释，以及所属文件夹的 FOLDER.md。

name: Issue triage

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

jobs:
  classify:
    name: Classify requirement size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: size
        name: Calculate size
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/requirement-size.mjs
      - name: Apply labels
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;
            const size = '${{ steps.size.outputs.size }}';
            const splitRequired = '${{ steps.size.outputs.split_required }}' === 'true';
            const current = context.payload.issue.labels.map((label) =>
              typeof label === 'string' ? label : label.name
            );
            const managed = current.filter((label) => label.startsWith('size/') || label === 'needs-split');
            const wanted = [`size/${size}`];
            if (splitRequired) wanted.push('needs-split');

            for (const label of managed) {
              if (!wanted.includes(label)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label });
              }
            }

            const lifecycle = new Set([
              'needs-triage', 'needs-info', 'ready-for-agent', 'ready-for-human',
              'in-progress', 'in-review', 'done', 'released', 'wontfix'
            ]);
            if (context.payload.action === 'opened' && !current.some((label) => lifecycle.has(label))) {
              wanted.push('needs-triage');
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: wanted });
