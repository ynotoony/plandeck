        context_length: 1000000
        name: DeepSeek V4 Pro
      deepseek-v4-flash:
        context_length: 1000000
        name: DeepSeek V4 Flash
    model: deepseek-v4-pro
  - name: nb
    base_url: https://relay.example.com/v1
    api_key: fixture-credential-beta-0002
    models:
      gpt-5.6-sol:
        name: gpt-5.6-sol
    model: gpt-5.6-sol
mcp_servers: {}
platforms:
  telegram:
    enabled: true
    home_channel:
      platform: telegram
      chat_id: '100000001'
      name: 测试用户
      user_id: '100000001'
vision:
  provider: alibaba
  model: qwen-vl-max
onboarding:
