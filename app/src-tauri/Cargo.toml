[package]
name = "plandeck"
version = "0.1.0"
description = "PlanDeck — 本地 AI Plan 订阅管理器"
license = "MIT"
repository = "https://github.com/ynotoony/plandeck"
homepage = "https://github.com/ynotoony/plandeck"
readme = "../../README.md"
edition = "2021"

[lib]
name = "plandeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true
